<!DOCTYPE html>
<html lang="en-ZA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thato Hopolang Botsane — Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="viewport-stage">

        <header class="top-nav">
            <span class="brand" id="global-reset">Thato Hopolang Botsane</span>
            <a href="mailto:your-email@domain.com" class="contact-btn">Contact</a>
        </header>

        <div class="content-slider-zone">

            <section class="hero-stage" id="initial-hero-stage">
                <div class="hero-text">
                    <div class="text-group">
                        <span class="eyebrow">UI/UX</span>
                        <h1 class="title">Designer</h1>
                    </div>
                    <div class="text-group">
                        <span class="eyebrow">Front-End</span>
                        <h1 class="title">Developer</h1>
                    </div>
                </div>

                <div class="profile-container">
                    <div class="blue-glow-circle"></div>
                    <img src="your-photo.png" alt="Thato Hopolang Botsane" class="split-face-img">
                </div>
            </section>

            <section class="project-detail-stage" id="case-study-stage" aria-hidden="true">
                <div class="project-bg-canvas" id="project-bg-canvas"></div>
                <div class="project-bg-overlay"></div>

                <div class="project-editorial-content">
                    <span class="project-tags" id="dynamic-tags">Design / Development</span>
                    <h2 class="project-title" id="dynamic-title">Project Title</h2>
                    <p class="project-description" id="dynamic-description">
                        Project description text drops cleanly here.
                    </p>
                    
                    <nav class="project-action-links">
                        <a href="#" class="action-link" id="link-live" target="_blank" rel="noopener noreferrer"><span class="link-index">01</span> Explore Live Site</a>
                        <a href="#" class="action-link" id="link-design" target="_blank" rel="noopener noreferrer"><span class="link-index">02</span> Explore Design</a>
                        <a href="#" class="action-link" id="link-code" target="_blank" rel="noopener noreferrer"><span class="link-index">03</span> Explore Codebase</a>
                    </nav>
                </div>
            </section>

        </div>

        <footer class="project-dock">
            <nav class="project-nav">
                <button class="nav-cell" data-project="studio">Studio&Set</button>
                <button class="nav-cell" data-project="perfect">Perfect Finish</button>
                <button class="nav-cell" data-project="solar">Solar & Secure</button>
                <button class="nav-cell" data-project="tours">Tours & Tours</button>
            </nav>
        </footer>

    </div>

    <script type="module" src="js/script.js"></script>
</body>
</html>
